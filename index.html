<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07203C" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Standard Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple Web App Compatibility Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DORMEX" />
    <meta name="description" content="DORMEX — Server-authoritative college hostel room and bed allocation platform for Siddaganga Institute of Technology, Tumakuru." />
    <title>DORMEX — College Hostel Allocation System</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('dormex_theme_preference') || 'system';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F6F1] dark:bg-[#080F1C] text-[#263345] dark:text-[#F1F5F9] antialiased font-sans selection:bg-[#2C8279] dark:selection:bg-[#63D6C6] selection:text-white dark:selection:text-[#080F1C] transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
